name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install "pytest>=8,<10"
      - name: Run core test matrix
        run: python scripts/verify_all.py --profile core
      - name: Upload test summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-tests-${{ matrix.os }}-py${{ matrix.python }}
          path: outputs/validation/core/
          retention-days: 7
